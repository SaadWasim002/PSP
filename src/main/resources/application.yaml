server:
  port: 3001

spring:
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/psp_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: psp
    show-sql: true
  flyway:
    enabled: true
    schemas: psp
    default-schema: psp
    locations: classpath:db/migration

npci:
  api:
    url: ${NPCI_API_URL:http://localhost:3002}

bank:
  api:
    url: ${BANK_API_URL:http://localhost:3003}
